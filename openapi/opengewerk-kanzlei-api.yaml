openapi: 3.1.0

info:
  title: OpenGewerk Kanzlei-API
  version: 0.7.0
  summary: Schnittstelle zwischen einer OpenGewerk-Instanz und dem Kanzlei-Hub
  description: |
    Diese Spezifikation beschreibt die Endpunkte, die eine OpenGewerk-Instanz für
    einen angebundenen Kanzlei-Hub bereitstellt. Der Mandant ist der Server, der
    Hub ist der Client. Die Verbindung wird immer vom Mandanten aus aufgebaut, und
    jeder Zugriff ist durch Scopes begrenzt, die der Mandant einzeln vergibt und
    jederzeit widerrufen kann.

    Pfade, Methoden, Scopes und Nutzlasten stehen fest. Die Nutzlasten sind als
    JSON-Schemas unter `schemas/` abgelegt und von hier aus referenziert, damit
    dieselben Schemas auch in den Webhook-Ereignissen und in den
    Konformitätstests gelten. Ohne eigene Nutzlast ist nur noch der Export für
    die Betriebsprüfung.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-konventionen:
    betraege: >
      Alle Geldbeträge sind ganzzahlige Cent-Werte im Feldtyp integer.
      Gleitkommazahlen sind an keiner Stelle zulässig, weder in Anfragen noch in
      Antworten. Die Währung steht als eigenes Feld nach ISO 4217, Vorgabe EUR.
    datumsangaben: >
      Alle Datums- und Zeitangaben folgen ISO 8601. Ein reines Datum wird als
      YYYY-MM-DD übertragen, ein Zeitpunkt als YYYY-MM-DDTHH:MM:SSZ in UTC,
      ein Zeitraum über getrennte Felder von und bis, jeweils einschließlich.
    steuerschluessel: >
      Steuerschlüssel folgen der DATEV-Konvention, damit der spätere Export
      verlustfrei bleibt.
    paginierung: >
      Listen sind paginiert und liefern ETag; der Hub sendet If-None-Match und
      bekommt bei unverändertem Stand 304 zurück.
    versionsaushandlung: >
      Jede Antwort trägt den Kopf X-OpenGewerk-Api-Version mit der Version, die
      die Instanz bedient. Der Hub darf denselben Kopf an jeder Anfrage mitschicken,
      um zu sagen, gegen welche Version er gebaut ist. Weichen die Hauptversionen
      voneinander ab, antwortet die Instanz mit HTTP 409 und liefert keine Nutzlast,
      die der Hub nicht lesen könnte. Solange die Hauptversion 0 ist, tritt die
      Nebenversion an ihre Stelle: der Vertrag darf sich bis 1.0.0 in jeder
      Nebenversion ändern, ein Vergleich allein der Null wäre bis dahin kein
      Vergleich.
    idempotenz: >
      Schreibende Aufrufe verlangen den Kopf Idempotency-Key. Ein wiederholter
      Aufruf mit demselben Schlüssel erzeugt keinen zweiten Datensatz, sondern
      liefert das Ergebnis des ersten. Derselbe Schlüssel mit einem abweichenden
      Körper wird mit HTTP 422 abgelehnt, und ein Schlüssel bleibt mindestens
      24 Stunden gebunden.

servers:
  - url: https://{mandant}/api/kanzlei/v1
    description: Die OpenGewerk-Instanz des Mandanten
    variables:
      mandant:
        default: betrieb.example
        description: Hostname der Mandanten-Instanz, vom Mandanten beim Handshake mitgeteilt

security:
  - taxFirmToken: []

tags:
  - name: Accounting
    description: Lesende Sicht auf Journal, Konten, Salden und offene Posten
  - name: Documents
    description: Belegbilder und E-Rechnungs-XML einzelner Belege
  - name: Periods
    description: Festschreibungsstatus und Werte der Umsatzsteuer-Voranmeldung
  - name: Collaboration
    description: Rückfragen der Kanzlei und Buchungsvorschläge zur Freigabe durch den Mandanten
  - name: MasterData
    description: Kontenrahmen-Profil der Kanzlei
  - name: Records
    description: Betriebsprüfungs-Export und Zugriffsprotokoll

paths:
  /periods:
    get:
      tags: [Periods]
      operationId: readPeriods
      summary: Perioden mit Festschreibungsstatus abrufen
      description: |
        Liefert die Buchungsperioden des Mandanten mit Festschreibungsstatus und
        den Werten der Umsatzsteuer-Voranmeldung. Benötigt den Scope `read:periods`.

        Sortiert nach Beginn der Periode aufsteigend.
      security:
        - taxFirmToken: [read:periods]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Perioden des Mandanten
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/period.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /journal:
    get:
      tags: [Accounting]
      operationId: readJournal
      summary: Journalzeilen eines Zeitraums abrufen
      description: |
        Liefert die Buchungssätze des Mandanten für einen Zeitraum, paginiert.
        Festgeschriebene Buchungen sind als solche gekennzeichnet.
        Benötigt den Scope `read:ledger`.

        Sortiert nach Buchungsdatum aufsteigend, bei gleichem Datum nach `id`.
      security:
        - taxFirmToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Journalzeilen des angefragten Zeitraums
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/journal-entry.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /accounts:
    get:
      tags: [Accounting]
      operationId: readAccounts
      summary: Kontenplan des Mandanten abrufen
      description: |
        Liefert den Kontenplan mit Kontonummer, Bezeichnung, Kontenrahmen und
        Automatikkonten-Kennzeichen. Benötigt den Scope `read:ledger`.

        Sortiert nach Kontonummer aufsteigend, als Zeichenkette verglichen.
      security:
        - taxFirmToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Kontenplan des Mandanten
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/account.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /balances:
    get:
      tags: [Accounting]
      operationId: readBalances
      summary: Salden je Konto für einen Stichtag abrufen
      description: |
        Liefert die Summen- und Saldenliste zu einem Stichtag.
        Benötigt den Scope `read:ledger`.

        Sortiert nach Kontonummer aufsteigend, als Zeichenkette verglichen.
      security:
        - taxFirmToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Salden je Konto zum Stichtag
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/balance.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /open-items:
    get:
      tags: [Accounting]
      operationId: readOpenItems
      summary: Offene Posten der Debitoren und Kreditoren abrufen
      description: |
        Liefert die offenen Posten mit Fälligkeit, Mahnstufe und Restbetrag.
        Benötigt den Scope `read:ledger`.

        Sortiert nach Fälligkeit aufsteigend, bei gleicher Fälligkeit nach `id`.
      security:
        - taxFirmToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Offene Posten des Mandanten
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/open-item.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /documents/{id}:
    get:
      tags: [Documents]
      operationId: readDocument
      summary: Einzelnen Beleg mit Bild und E-Rechnungs-XML abrufen
      description: |
        Liefert einen einzelnen Beleg zur Anzeige im Hub. Der Hub speichert
        Belegdaten nicht dauerhaft. Benötigt den Scope `read:documents`.
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/DocumentId"
      security:
        - taxFirmToken: [read:documents]
      responses:
        "200":
          description: Beleg mit seinen Dateien
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "../schemas/document.schema.json"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"
        "404":
          $ref: "#/components/responses/NotFound"

  /inquiries:
    get:
      tags: [Collaboration]
      operationId: readInquiries
      summary: Rückfragen dieser Kanzlei abrufen
      description: |
        Liefert die Rückfragen, die diese Kanzlei an diesem Mandanten
        angelegt hat, mit Status und Antworten. Ohne diesen Weg wäre eine
        abgesendete Rückfrage für ihren Absender unerreichbar, und das
        Rückfragen-Postfach über alle Mandanten ließe sich nicht bauen.
        Benötigt den Scope `write:comments`, denselben wie das Anlegen: wer
        fragen darf, darf die Antwort lesen.

        Sortiert nach Zeitpunkt der Anlage absteigend, die jüngste zuerst, bei
        gleichem Zeitpunkt nach `id`.
      security:
        - taxFirmToken: [write:comments]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Rückfragen dieser Kanzlei
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/inquiry.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

    post:
      tags: [Collaboration]
      operationId: createInquiry
      summary: Rückfrage der Kanzlei an einem Beleg anlegen
      description: |
        Legt eine Rückfrage an, die im Mandantensystem am Beleg und im
        Rückfragen-Postfach erscheint. Benötigt den Scope `write:comments`.
      security:
        - taxFirmToken: [write:comments]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/inquiry.schema.json#/$defs/New"
      responses:
        "201":
          description: Rückfrage angelegt
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "../schemas/inquiry.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /proposals:
    get:
      tags: [Collaboration]
      operationId: readProposals
      summary: Buchungsvorschläge dieser Kanzlei abrufen
      description: |
        Liefert die Vorschläge, die diese Kanzlei an diesem Mandanten
        eingereicht hat, mit Status, Entscheidung und den Kennungen der
        entstandenen Buchungen. Ohne diesen Weg bliebe nach dem Einreichen
        unsichtbar, ob der Mandant zugestimmt hat. Benötigt den Scope
        `write:proposals`, denselben wie das Einreichen.

        Sortiert nach Zeitpunkt der Einreichung absteigend, der jüngste zuerst,
        bei gleichem Zeitpunkt nach `id`.
      security:
        - taxFirmToken: [write:proposals]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Buchungsvorschläge dieser Kanzlei
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/booking-proposal.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"

    post:
      tags: [Collaboration]
      operationId: submitProposal
      summary: Buchungs- oder Kontierungsvorschlag einreichen
      description: |
        Reicht einen Vorschlag ein, den der Mandant mit einem Klick bestätigt.
        Benötigt den Scope `write:proposals`. Direktes Buchen ohne Bestätigung
        verlangt zusätzlich den Scope `write:closing`.
      security:
        - taxFirmToken: [write:proposals]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/booking-proposal.schema.json#/$defs/New"
      responses:
        "201":
          description: Vorschlag eingereicht
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "../schemas/booking-proposal.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /coa-profile:
    put:
      tags: [MasterData]
      operationId: setChartOfAccountsProfile
      summary: Kontenrahmen-Profil der Kanzlei übertragen
      description: |
        Überträgt Standard-Kontierungen, Automatikkonten und Steuerschlüssel an
        den Mandanten. Der Mandant sieht eine Vorschau vor der Übernahme.
        Benötigt den Scope `write:coa`.

        Konten, die das Profil nicht nennt, bleiben unberührt. Die Liste
        `accounts` sagt, was angelegt oder geändert werden soll, sie ist keine
        Aufzählung dessen, was danach da sein soll.

        Ob das Profil sofort gilt oder erst als Vorschau liegt, entscheidet der
        Mandant in seiner Instanz. Die Antwort sagt es im Feld `state`.
      security:
        - taxFirmToken: [write:coa]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/chart-of-accounts-profile.schema.json"
      responses:
        "200":
          description: |
            Profil übernommen oder zur Vorschau hinterlegt. Welches von beidem,
            steht in `state`: ohne dieses Feld könnte die Kanzlei die beiden
            Fälle nicht unterscheiden, und die Vorschau wäre für sie unsichtbar.
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state, profile]
                properties:
                  state:
                    type: string
                    enum: [applied, pending_preview]
                    description: |
                      `applied`, wenn das Profil ab `valid_from` gilt.
                      `pending_preview`, wenn es beim Mandanten liegt und auf
                      dessen Freigabe wartet.
                  profile:
                    $ref: "../schemas/chart-of-accounts-profile.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "403":
          $ref: "#/components/responses/ScopeMissing"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /audit-export:
    post:
      tags: [Records]
      operationId: startAuditExport
      summary: Export für die Betriebsprüfung auslösen
      description: |
        Stößt einen Z1-, Z2- oder Z3-Export nach GDPdU an. Der Export läuft im
        Mandantensystem, der Hub bekommt einen Verweis auf das Ergebnis.
        Benötigt den Scope `export:audit`.
      security:
        - taxFirmToken: [export:audit]
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: |
            Export angestoßen. Die Nutzlast dieses Endpunkts ist noch nicht
            festgelegt, sie gehört nicht zu den zehn Schemas unter `schemas/`.
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Placeholder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/ScopeMissing"

  /access-log:
    get:
      tags: [Records]
      operationId: readAccessLog
      summary: Zugriffsprotokoll der eigenen Kanzlei abrufen
      description: |
        Liefert die protokollierten Zugriffe der anfragenden Kanzlei auf diese
        Instanz. Dieselben Einträge sieht der Mandant in seiner Oberfläche.
        Das Protokoll ist für beide Seiten einsehbar und braucht keinen
        zusätzlichen Scope.

        Sortiert nach Zeitpunkt des Zugriffs absteigend, der jüngste zuerst, bei
        gleichem Zeitpunkt nach `id`.
      security:
        - taxFirmToken: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Protokollierte Zugriffe der eigenen Kanzlei
          headers:
            X-OpenGewerk-Api-Version:
              $ref: "#/components/headers/ApiVersion"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/access-log-entry.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/ApiVersionIncompatible"

components:
  securitySchemes:
    taxFirmToken:
      type: oauth2
      description: |
        Der beim Handshake ausgehandelte Token wird als Bearer-Token gesendet.
        Er trägt genau die Scopes, die der Mandant vergeben hat, ist rotierbar,
        läuft bei Inaktivität ab und kann vom Mandanten jederzeit sofort gesperrt
        werden.

        Die erste Fassung arbeitet mit rotierenden Token bei erzwungenem HTTPS
        und kurzer Laufzeit. Eine kryptografische Bindung an die Hub-Instanz
        (DPoP oder mTLS) ist vorgesehen, aber nicht Teil dieser Fassung, siehe
        ADR 0006 im Repository `opengewerk`.

        Die unter `tokenUrl` genannte Adresse ist für die Ausgabe und Erneuerung
        des Tokens reserviert. Der Verbindungsaufbau selbst läuft über den
        Einladungscode des Mandanten und ist in dieser Fassung noch nicht als
        Endpunkt beschrieben.
      flows:
        clientCredentials:
          tokenUrl: https://{mandant}/api/kanzlei/v1/token
          scopes:
            read:ledger: Journal, Konten, Salden und offene Posten lesen
            read:documents: Belegbilder und E-Rechnungs-XML lesen
            read:master: Stammdaten zu Kunden, Lieferanten und Anlagen lesen
            read:periods: Festschreibungsstatus und Werte der Umsatzsteuer-Voranmeldung lesen
            write:comments: Rückfragen und Kommentare an Belegen hinterlassen
            write:proposals: Buchungs- und Kontierungsvorschläge einreichen
            write:coa: Kontenrahmen-Profil und Automatikkonten setzen
            write:closing: Abschlussbuchungen direkt buchen
            export:audit: Betriebsprüfungs-Export auslösen

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      description: Kennung des Belegs im Mandantensystem
      schema:
        type: string

    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor der gewünschten Seite, aus dem Feld next_cursor der vorigen Antwort
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Höchstzahl der Einträge je Seite
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    From:
      name: from
      in: query
      required: true
      description: Erster Tag des Zeitraums, einschließlich
      schema:
        type: string
        format: date

    To:
      name: to
      in: query
      required: true
      description: Letzter Tag des Zeitraums, einschließlich
      schema:
        type: string
        format: date

    AsOf:
      name: as_of
      in: query
      required: true
      description: Stichtag der Auswertung, einschließlich
      schema:
        type: string
        format: date

    Year:
      name: year
      in: query
      required: false
      description: Beschränkt die Antwort auf ein Kalenderjahr
      schema:
        type: integer
        minimum: 2000

    ApiVersion:
      name: X-OpenGewerk-Api-Version
      in: header
      required: false
      description: |
        Vertragsversion, gegen die der Hub gebaut ist. Weicht die Hauptversion von
        der Version der Instanz ab, antwortet die Instanz mit HTTP 409, statt eine
        Antwort zu liefern, die der Hub nicht lesen kann. Solange beide Seiten die
        Hauptversion 0 tragen, entscheidet stattdessen die Nebenversion, denn bis
        1.0.0 darf sich der Vertrag in jeder Nebenversion ändern. Fehlt der Kopf,
        nimmt die Instanz Verträglichkeit an.
      schema:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Schlüssel, mit dem ein wiederholter Aufruf erkannt wird. Derselbe
        Schlüssel erzeugt keinen zweiten Datensatz, sondern liefert das Ergebnis
        des ersten Aufrufs.

        Kommt derselbe Schlüssel mit einem abweichenden Körper, ist das kein
        Wiederholen, sondern ein Fehler auf der Gegenseite: die Instanz antwortet
        mit HTTP 422 und führt nichts aus. Stillschweigend die erste Antwort zu
        liefern wäre schlimmer, der Hub hielte dann etwas für gespeichert, was nie
        ankam.

        Ein Schlüssel bleibt mindestens 24 Stunden ab dem ersten Aufruf gebunden.
        Danach darf die Instanz ihn vergessen, und ein Aufruf mit demselben
        Schlüssel zählt wieder als neuer.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  headers:
    ApiVersion:
      description: |
        Vertragsversion, die diese Instanz bedient. Sie steht an jeder Antwort, auch
        an Fehlerantworten, damit der Hub die Version schon beim ersten Aufruf kennt
        und nicht erst beim ersten Bruch.
      schema:
        type: string
      required: true

    ETag:
      description: |
        Kennzeichen des ausgelieferten Standes. Der Hub sendet es beim nächsten
        Abruf als If-None-Match und bekommt bei unverändertem Stand HTTP 304.

        Es bezieht sich auf genau diese Seite, also auf die Antwort zu dieser
        Kombination aus Endpunkt, Filtern, Cursor und Limit, nicht auf die Liste
        als Ganzes. Ein Hub, der über mehrere Seiten blättert, hält je Seite ein
        eigenes ETag. Gleicher Stand heißt derselbe Wert: eine Antwort, die sich
        in keinem Feld unterscheidet, trägt dasselbe Kennzeichen, auch wenn sie
        neu berechnet wurde.
      schema:
        type: string

  schemas:
    Placeholder:
      title: Placeholder
      description: |
        Die Nutzlast dieses Endpunkts ist noch nicht festgelegt. Die verbindlichen
        Schemas entstehen unter `schemas/` und werden an dieser Stelle eingehängt,
        sobald sie vorliegen.

    Error:
      title: Error
      description: Einheitliche Fehlerantwort aller Endpunkte
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Maschinenlesbarer Fehlercode
        message:
          type: string
          description: Beschreibung des Fehlers für Menschen
        scope:
          type: string
          description: Der fehlende Scope, falls der Fehler daran liegt
        parameter:
          type: string
          description: |
            Der beanstandete Parameter, falls der Fehler an einem einzelnen hängt.
            Bei einem Kopf steht hier dessen Name, etwa Idempotency-Key.

  responses:
    BadRequest:
      description: |
        Die Anfrage ist nicht auswertbar: ein Pflichtparameter fehlt, ein Wert hält sein
        Format nicht ein, oder der Rumpf ist kein gültiges JSON. Das Fehlerobjekt benennt
        im Feld parameter den beanstandeten Parameter, sofern es an einem einzelnen liegt.
        Diese Antwort sagt nichts über Berechtigungen: ein fehlender Scope wird mit 403
        beantwortet, auch wenn zusätzlich ein Parameter fehlt.
      headers:
        X-OpenGewerk-Api-Version:
          $ref: "#/components/headers/ApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotModified:
      description: Der Stand hat sich seit dem mitgesendeten ETag nicht geändert

    ApiVersionIncompatible:
      description: |
        Die Version im Kopf X-OpenGewerk-Api-Version passt nicht zu der Version, die
        diese Instanz bedient: die Hauptversionen weichen ab, oder beide stehen auf 0
        und die Nebenversionen weichen ab
      headers:
        X-OpenGewerk-Api-Version:
          $ref: "#/components/headers/ApiVersion"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnprocessableEntity:
      description: Die Anfrage ist wohlgeformt, aber fachlich nicht verarbeitbar
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: Kein oder ungültiger Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ScopeMissing:
      description: Der Mandant hat den nötigen Scope nicht freigegeben
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Die angeforderte Ressource gibt es nicht
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
