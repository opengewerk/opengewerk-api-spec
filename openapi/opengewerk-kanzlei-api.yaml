openapi: 3.1.0

info:
  title: OpenGewerk Kanzlei-API
  version: 0.3.0
  summary: Schnittstelle zwischen einer OpenGewerk-Instanz und dem Kanzlei-Hub
  description: |
    Diese Spezifikation beschreibt die Endpunkte, die eine OpenGewerk-Instanz für
    einen angebundenen Kanzlei-Hub bereitstellt. Der Mandant ist der Server, der
    Hub ist der Client. Die Verbindung wird immer vom Mandanten aus aufgebaut, und
    jeder Zugriff ist durch Scopes begrenzt, die der Mandant einzeln vergibt und
    jederzeit widerrufen kann.

    Pfade, Methoden, Scopes und Nutzlasten stehen fest. Die Nutzlasten sind als
    JSON-Schemas unter `schemas/` abgelegt und von hier aus referenziert, damit
    dieselben Schemas auch in den Webhook-Ereignissen und in den
    Konformitätstests gelten. Ohne eigene Nutzlast ist nur noch der Export für
    die Betriebsprüfung.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-konventionen:
    betraege: >
      Alle Geldbeträge sind ganzzahlige Cent-Werte im Feldtyp integer.
      Gleitkommazahlen sind an keiner Stelle zulässig, weder in Anfragen noch in
      Antworten. Die Währung steht als eigenes Feld nach ISO 4217, Vorgabe EUR.
    datumsangaben: >
      Alle Datums- und Zeitangaben folgen ISO 8601. Ein reines Datum wird als
      YYYY-MM-DD übertragen, ein Zeitpunkt als YYYY-MM-DDTHH:MM:SSZ in UTC,
      ein Zeitraum über getrennte Felder von und bis, jeweils einschließlich.
    steuerschluessel: >
      Steuerschlüssel folgen der DATEV-Konvention, damit der spätere Export
      verlustfrei bleibt.
    paginierung: >
      Listen sind paginiert und liefern ETag; der Hub sendet If-None-Match und
      bekommt bei unverändertem Stand 304 zurück.
    idempotenz: >
      Schreibende Aufrufe verlangen den Kopf Idempotency-Key. Ein wiederholter
      Aufruf mit demselben Schlüssel erzeugt keinen zweiten Datensatz.

servers:
  - url: https://{mandant}/api/kanzlei/v1
    description: Die OpenGewerk-Instanz des Mandanten
    variables:
      mandant:
        default: betrieb.example
        description: Hostname der Mandanten-Instanz, vom Mandanten beim Handshake mitgeteilt

security:
  - kanzleiToken: []

tags:
  - name: Buchhaltung
    description: Lesende Sicht auf Journal, Konten, Salden und offene Posten
  - name: Belege
    description: Belegbilder und E-Rechnungs-XML einzelner Belege
  - name: Perioden
    description: Festschreibungsstatus und Werte der Umsatzsteuer-Voranmeldung
  - name: Zusammenarbeit
    description: Rückfragen der Kanzlei und Buchungsvorschläge zur Freigabe durch den Mandanten
  - name: Stammdaten
    description: Kontenrahmen-Profil der Kanzlei
  - name: Nachweise
    description: Betriebsprüfungs-Export und Zugriffsprotokoll

paths:
  /periods:
    get:
      tags: [Perioden]
      operationId: periodenLesen
      summary: Perioden mit Festschreibungsstatus abrufen
      description: |
        Liefert die Buchungsperioden des Mandanten mit Festschreibungsstatus und
        den Werten der Umsatzsteuer-Voranmeldung. Benötigt den Scope `read:periods`.
      security:
        - kanzleiToken: [read:periods]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Jahr"
      responses:
        "200":
          description: Perioden des Mandanten
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/periode.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /journal:
    get:
      tags: [Buchhaltung]
      operationId: journalLesen
      summary: Journalzeilen eines Zeitraums abrufen
      description: |
        Liefert die Buchungssätze des Mandanten für einen Zeitraum, paginiert.
        Festgeschriebene Buchungen sind als solche gekennzeichnet.
        Benötigt den Scope `read:ledger`.
      security:
        - kanzleiToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Von"
        - $ref: "#/components/parameters/Bis"
      responses:
        "200":
          description: Journalzeilen des angefragten Zeitraums
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/journalzeile.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /accounts:
    get:
      tags: [Buchhaltung]
      operationId: kontenLesen
      summary: Kontenplan des Mandanten abrufen
      description: |
        Liefert den Kontenplan mit Kontonummer, Bezeichnung, Kontenrahmen und
        Automatikkonten-Kennzeichen. Benötigt den Scope `read:ledger`.
      security:
        - kanzleiToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Kontenplan des Mandanten
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/konto.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /balances:
    get:
      tags: [Buchhaltung]
      operationId: saldenLesen
      summary: Salden je Konto für einen Stichtag abrufen
      description: |
        Liefert die Summen- und Saldenliste zu einem Stichtag.
        Benötigt den Scope `read:ledger`.
      security:
        - kanzleiToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Stichtag"
      responses:
        "200":
          description: Salden je Konto zum Stichtag
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/saldo.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /open-items:
    get:
      tags: [Buchhaltung]
      operationId: offenePostenLesen
      summary: Offene Posten der Debitoren und Kreditoren abrufen
      description: |
        Liefert die offenen Posten mit Fälligkeit, Mahnstufe und Restbetrag.
        Benötigt den Scope `read:ledger`.
      security:
        - kanzleiToken: [read:ledger]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Offene Posten des Mandanten
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/offener-posten.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /documents/{id}:
    get:
      tags: [Belege]
      operationId: belegLesen
      summary: Einzelnen Beleg mit Bild und E-Rechnungs-XML abrufen
      description: |
        Liefert einen einzelnen Beleg zur Anzeige im Hub. Der Hub speichert
        Belegdaten nicht dauerhaft. Benötigt den Scope `read:documents`.
      parameters:
        - $ref: "#/components/parameters/BelegId"
      security:
        - kanzleiToken: [read:documents]
      responses:
        "200":
          description: Beleg mit seinen Dateien
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "../schemas/beleg.schema.json"
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"
        "404":
          $ref: "#/components/responses/NichtGefunden"

  /inquiries:
    post:
      tags: [Zusammenarbeit]
      operationId: rueckfrageStellen
      summary: Rückfrage der Kanzlei an einem Beleg anlegen
      description: |
        Legt eine Rückfrage an, die im Mandantensystem am Beleg und im
        Rückfragen-Postfach erscheint. Benötigt den Scope `write:comments`.
      security:
        - kanzleiToken: [write:comments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/rueckfrage.schema.json#/$defs/Neu"
      responses:
        "201":
          description: Rückfrage angelegt
          content:
            application/json:
              schema:
                $ref: "../schemas/rueckfrage.schema.json"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"
        "422":
          $ref: "#/components/responses/NichtVerarbeitbar"

  /proposals:
    post:
      tags: [Zusammenarbeit]
      operationId: buchungsvorschlagEinreichen
      summary: Buchungs- oder Kontierungsvorschlag einreichen
      description: |
        Reicht einen Vorschlag ein, den der Mandant mit einem Klick bestätigt.
        Benötigt den Scope `write:proposals`. Direktes Buchen ohne Bestätigung
        verlangt zusätzlich den Scope `write:closing`.
      security:
        - kanzleiToken: [write:proposals]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/buchungsvorschlag.schema.json#/$defs/Neu"
      responses:
        "201":
          description: Vorschlag eingereicht
          content:
            application/json:
              schema:
                $ref: "../schemas/buchungsvorschlag.schema.json"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"
        "422":
          $ref: "#/components/responses/NichtVerarbeitbar"

  /coa-profile:
    put:
      tags: [Stammdaten]
      operationId: kontenrahmenProfilSetzen
      summary: Kontenrahmen-Profil der Kanzlei übertragen
      description: |
        Überträgt Standard-Kontierungen, Automatikkonten und Steuerschlüssel an
        den Mandanten. Der Mandant sieht eine Vorschau vor der Übernahme.
        Benötigt den Scope `write:coa`.
      security:
        - kanzleiToken: [write:coa]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/kontenrahmen-profil.schema.json"
      responses:
        "200":
          description: Profil übernommen oder zur Vorschau hinterlegt
          content:
            application/json:
              schema:
                $ref: "../schemas/kontenrahmen-profil.schema.json"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"
        "422":
          $ref: "#/components/responses/NichtVerarbeitbar"

  /audit-export:
    post:
      tags: [Nachweise]
      operationId: betriebspruefungsExportAusloesen
      summary: Export für die Betriebsprüfung auslösen
      description: |
        Stößt einen Z1-, Z2- oder Z3-Export nach GDPdU an. Der Export läuft im
        Mandantensystem, der Hub bekommt einen Verweis auf das Ergebnis.
        Benötigt den Scope `export:audit`.
      security:
        - kanzleiToken: [export:audit]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: |
            Export angestoßen. Die Nutzlast dieses Endpunkts ist noch nicht
            festgelegt, sie gehört nicht zu den zehn Schemas unter `schemas/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platzhalter"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"
        "403":
          $ref: "#/components/responses/ScopeFehlt"

  /access-log:
    get:
      tags: [Nachweise]
      operationId: zugriffsprotokollLesen
      summary: Zugriffsprotokoll der eigenen Kanzlei abrufen
      description: |
        Liefert die protokollierten Zugriffe der anfragenden Kanzlei auf diese
        Instanz. Dieselben Einträge sieht der Mandant in seiner Oberfläche.
        Das Protokoll ist für beide Seiten einsehbar und braucht keinen
        zusätzlichen Scope.
      security:
        - kanzleiToken: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Protokollierte Zugriffe der eigenen Kanzlei
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "../schemas/protokolleintrag.schema.json"
                  next_cursor:
                    type: [string, "null"]
                    description: Cursor der nächsten Seite. Null bedeutet, dass keine weitere folgt.
        "304":
          $ref: "#/components/responses/NichtModifiziert"
        "401":
          $ref: "#/components/responses/NichtAuthentifiziert"

components:
  securitySchemes:
    kanzleiToken:
      type: oauth2
      description: |
        Der beim Handshake ausgehandelte Token wird als Bearer-Token gesendet.
        Er trägt genau die Scopes, die der Mandant vergeben hat, ist rotierbar,
        läuft bei Inaktivität ab und kann vom Mandanten jederzeit sofort gesperrt
        werden.

        Die erste Fassung arbeitet mit rotierenden Token bei erzwungenem HTTPS
        und kurzer Laufzeit. Eine kryptografische Bindung an die Hub-Instanz
        (DPoP oder mTLS) ist vorgesehen, aber nicht Teil dieser Fassung, siehe
        ADR 0006 im Repository `opengewerk`.

        Die unter `tokenUrl` genannte Adresse ist für die Ausgabe und Erneuerung
        des Tokens reserviert. Der Verbindungsaufbau selbst läuft über den
        Einladungscode des Mandanten und ist in dieser Fassung noch nicht als
        Endpunkt beschrieben.
      flows:
        clientCredentials:
          tokenUrl: https://{mandant}/api/kanzlei/v1/token
          scopes:
            read:ledger: Journal, Konten, Salden und offene Posten lesen
            read:documents: Belegbilder und E-Rechnungs-XML lesen
            read:master: Stammdaten zu Kunden, Lieferanten und Anlagen lesen
            read:periods: Festschreibungsstatus und Werte der Umsatzsteuer-Voranmeldung lesen
            write:comments: Rückfragen und Kommentare an Belegen hinterlassen
            write:proposals: Buchungs- und Kontierungsvorschläge einreichen
            write:coa: Kontenrahmen-Profil und Automatikkonten setzen
            write:closing: Abschlussbuchungen direkt buchen
            export:audit: Betriebsprüfungs-Export auslösen

  parameters:
    BelegId:
      name: id
      in: path
      required: true
      description: Kennung des Belegs im Mandantensystem
      schema:
        type: string

    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor der gewünschten Seite, aus dem Feld next_cursor der vorigen Antwort
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: Höchstzahl der Einträge je Seite
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    Von:
      name: from
      in: query
      required: true
      description: Erster Tag des Zeitraums, einschließlich
      schema:
        type: string
        format: date

    Bis:
      name: to
      in: query
      required: true
      description: Letzter Tag des Zeitraums, einschließlich
      schema:
        type: string
        format: date

    Stichtag:
      name: as_of
      in: query
      required: true
      description: Stichtag der Auswertung, einschließlich
      schema:
        type: string
        format: date

    Jahr:
      name: year
      in: query
      required: false
      description: Beschränkt die Antwort auf ein Kalenderjahr
      schema:
        type: integer
        minimum: 2000

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Schlüssel, mit dem ein wiederholter Aufruf erkannt wird. Derselbe
        Schlüssel erzeugt keinen zweiten Datensatz, sondern liefert das Ergebnis
        des ersten Aufrufs.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  headers:
    ETag:
      description: |
        Kennzeichen des ausgelieferten Standes. Der Hub sendet es beim nächsten
        Abruf als If-None-Match und bekommt bei unverändertem Stand HTTP 304.
      schema:
        type: string

  schemas:
    Platzhalter:
      title: Platzhalter
      description: |
        Die Nutzlast dieses Endpunkts ist noch nicht festgelegt. Die verbindlichen
        Schemas entstehen unter `schemas/` und werden an dieser Stelle eingehängt,
        sobald sie vorliegen.

    Fehler:
      title: Fehler
      description: Einheitliche Fehlerantwort aller Endpunkte
      type: object
      required: [code, meldung]
      properties:
        code:
          type: string
          description: Maschinenlesbarer Fehlercode
        meldung:
          type: string
          description: Beschreibung des Fehlers für Menschen
        scope:
          type: string
          description: Der fehlende Scope, falls der Fehler daran liegt

  responses:
    NichtModifiziert:
      description: Der Stand hat sich seit dem mitgesendeten ETag nicht geändert

    NichtVerarbeitbar:
      description: Die Anfrage ist wohlgeformt, aber fachlich nicht verarbeitbar
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"

    NichtAuthentifiziert:
      description: Kein oder ungültiger Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"

    ScopeFehlt:
      description: Der Mandant hat den nötigen Scope nicht freigegeben
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"

    NichtGefunden:
      description: Die angeforderte Ressource gibt es nicht
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
